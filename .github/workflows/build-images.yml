name: Build and publish ToonSim images

on:
  push:
    branches: [main]
    paths:
      - "toonsim/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '/^version:/ {print $2; exit}' toonsim/config.yaml)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./toonsim
          file: ./toonsim/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/markbasgitaar/toonsim-homeassistant:build-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=toonsim-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=toonsim-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '/^version:/ {print $2; exit}' toonsim/config.yaml)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture tags
        shell: bash
        run: |
          set -eu
          IMAGE=ghcr.io/markbasgitaar/toonsim-homeassistant
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ steps.version.outputs.value }}" \
            "$IMAGE:build-aarch64" \
            "$IMAGE:build-amd64"
